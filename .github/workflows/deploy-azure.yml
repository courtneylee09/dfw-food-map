name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}

      # The server bundle imports vite at runtime, so ship node_modules with devDependencies
      - name: Package
        run: |
          echo "{\"sha\":\"$GITHUB_SHA\"}" > dist/version.json
          zip -qry deploy.zip dist node_modules package.json package-lock.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: dfwfoodmap
          package: deploy.zip

      # Zip deploy replaces the files but doesn't always restart Node, which leaves the old server running
      - name: Restart app
        run: az webapp restart --name dfwfoodmap --resource-group techsavvy-rg

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            sha=$(curl -s https://dfwfoodmap.azurewebsites.net/api/health | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            code=$(curl -s -o /dev/null -w "%{http_code}" https://dfwfoodmap.azurewebsites.net/api/resources || true)
            if [ "$sha" = "$GITHUB_SHA" ] && [ "$code" = "200" ]; then echo "New version $sha is live"; exit 0; fi
            echo "Waiting for new version (running: ${sha:-none}, api: $code)..."; sleep 10
          done
          echo "New version did not come up"; exit 1
